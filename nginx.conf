server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # App Platform ingress routes /api → api service.
  # Do not proxy to hostname "api" here — that only works in Docker Compose
  # and causes nginx to fail startup when "api" cannot be resolved.

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
  }

  location = /google6b3e5a23dad3986b.html {
    default_type text/html;
    try_files /google6b3e5a23dad3986b.html =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
