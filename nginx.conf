server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # App Platform ingress routes /api → api service.
  # Do not proxy to hostname "api" here — that only works in Docker Compose
  # and causes nginx to fail startup when "api" cannot be resolved.

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
